[project]
name = "django-starter-template"
version = "0.1.0"
description = "A modern Django starter template with DRF, JWT authentication, and Docker"
authors = [{ name = "prashunchi", email = "prashunchi@gmail.com" }]
readme = "README.md"
requires-python = ">3.13,<4.0"
dependencies = [
    "django>=5.2.14,<6.0.0",
    "django-configurations[cache,database]>=2.5.1,<3.0.0",
    "python-dotenv>=1.1.1,<2.0.0",
    "django-cors-headers>=4.7.0,<5.0.0",
    "djangorestframework>=3.17.1,<4.0.0",
    "django-filter>=25.2,<26.0",
    "djangorestframework-simplejwt>=5.5.0",
    "drf-spectacular>=0.29.0,<1.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "uvicorn[standard]",
    "python-json-logger",
]

[dependency-groups]
dev = [
    "ruff>=0.11.0,<1.0.0",
    "mypy>=1.15.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-django>=4.10.0,<5.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "factory-boy>=3.3.0,<4.0.0",
    "pre-commit>=4.1.0,<5.0.0",
    "django-stubs>=5.2.0,<6.0.0",
    "djangorestframework-stubs>=3.16.0,<4.0.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/migrations/*" = ["E501"]
"core/settings/_*.py" = ["N817"]
"core/urls.py" = ["N812"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "--strict-markers --tb=short -p no:cacheprovider"

[tool.coverage.run]
source = ["_auth", "health", "base", "core"]
omit = ["*/migrations/*", "*/tests/*"]
