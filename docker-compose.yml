services:
  db:
    image: postgres:18-alpine
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/18/data

  valkey:
    image: valkey/valkey:8
    env_file:
      - ./.env
    command: ["--requirepass", "${VALKEY_PASSWORD}"]
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - valkey_data:/data

  web:
    build: .
    env_file:
      - ./.env
    environment:
      - DJANGO_ENVIRONMENT=production
      - DJANGO_SETTINGS_MODULE=core.settings
      - DJANGO_CONFIGURATION=ProductionSettings
    ports:
      - 8000:8000
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  valkey_data:
